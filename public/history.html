<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>History</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#075e54">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/favicon-64.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script src="/pwa.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .history-actions { display: flex; justify-content: flex-end; gap: 8px; }
  </style>
</head>
<body>

<script src="/sidebar.js"></script>

<div class="main">
  <div class="page-hdr">
    <div>
      <div class="ph-title">History</div>
      <div class="ph-sub">Past bulk send runs and their analytics</div>
    </div>
    <div class="ph-user">
      <div class="ph-email-chip">
        <span class="ph-avatar" id="hdr-avatar">?</span>
        <span class="ph-email" id="hdr-email"></span>
      </div>
      <button class="btn-logout" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <!-- History of past runs -->
  <div class="card card-wide" id="history-section">
    <div class="card-hdr">
      <div class="card-title">Recent Sends <span id="history-count-label" style="font-size:11px;color:var(--text-3);font-weight:400"></span></div>
      <button class="btn btn-outline btn-sm" onclick="loadHistory()">↻ Refresh</button>
    </div>
    <div id="history-list"><div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">Loading...</div></div></div>
    <div id="history-pagination" style="display:none;align-items:center;justify-content:center;gap:14px;margin-top:18px"></div>
  </div>
</div>

<!-- Analytics Modal -->
<div class="modal-overlay" id="analytics-modal" onclick="closeAnalyticsOnBg(event)">
  <div class="modal">
    <div class="modal-hdr">
      <span class="modal-title">Send Analytics</span>
      <button class="modal-close" onclick="closeAnalytics()">✕</button>
    </div>
    <div style="padding:20px 24px">
      <div class="row-2" style="margin-bottom:16px">
        <div>
          <label>File</label>
          <div id="an-file" style="font-size:14px;font-weight:600;color:var(--text)"></div>
        </div>
        <div>
          <label>Template</label>
          <div id="an-template" style="font-size:14px;font-weight:600;color:var(--text)"></div>
        </div>
      </div>

      <div class="prog-stats">
        <span>Success rate</span>
        <span id="an-rate" style="font-weight:700;color:var(--text)"></span>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar" id="an-rate-bar" style="width:0%"></div>
      </div>
      <button class="btn btn-outline btn-sm" id="an-recipients-toggle" type="button" onclick="toggleRecipients()" style="margin-top:12px">Phone No's</button>
      <div id="an-recipients" style="display:none;margin-top:10px"></div>

      <div class="stat-grid" style="margin-top:20px;margin-bottom:6px">
        <div class="stat-card s-total">
          <div class="stat-num" id="an-total">0</div>
          <div class="stat-lbl">Total</div>
        </div>
        <div class="stat-card s-sent">
          <div class="stat-num" id="an-sent">0</div>
          <div class="stat-lbl">Sent</div>
        </div>
        <div class="stat-card s-failed">
          <div class="stat-num" id="an-failed">0</div>
          <div class="stat-lbl">Failed</div>
        </div>
      </div>

      <div class="row-2" style="margin-top:18px">
        <div>
          <label>Status</label>
          <div id="an-status" style="margin-top:4px"></div>
        </div>
        <div>
          <label>Delay used</label>
          <div id="an-delay" style="font-size:14px;font-weight:600;color:var(--text)"></div>
        </div>
      </div>
      <div class="row-2" style="margin-top:14px">
        <div>
          <label>Started</label>
          <div id="an-started" style="font-size:14px;font-weight:600;color:var(--text)"></div>
        </div>
        <div>
          <label>Duration</label>
          <div id="an-duration" style="font-size:14px;font-weight:600;color:var(--text)"></div>
        </div>
      </div>

      <div class="error-list" id="an-errors" style="display:none;margin-top:18px"></div>
    </div>
  </div>
</div>

<script>
  const API = '/api/send';
  let historyJobs = [];

  async function loadSidebarStatus() {
    try {
      const res  = await fetch('/api/whatsapp/status');
      const data = await res.json();
      const dot  = document.getElementById('sidebar-dot');
      const txt  = document.getElementById('sidebar-status-text');
      if (data.connected && data.data?.status === 'active') {
        dot.classList.add('on'); txt.textContent = 'Connected';
      } else {
        dot.classList.remove('on'); txt.textContent = 'Not connected';
      }
    } catch (e) {}
  }

  function esc(str) {
    return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function statusBadgeClass(status) {
    if (status === 'done')      return 'badge-green';
    if (status === 'running')   return 'badge-blue';
    if (status === 'paused')    return 'badge-yellow';
    if (status === 'cancelled') return 'badge-red';
    return 'badge-gray';
  }

  const HISTORY_PAGE_SIZE = 10;
  let historyPage = 1;

  async function loadHistory() {
    const el = document.getElementById('history-list');
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">⏳</div><div class="empty-text">Loading...</div></div>';
    document.getElementById('history-pagination').style.display = 'none';
    try {
      const res  = await fetch(`${API}/history`);
      const data = await res.json();
      historyJobs = data.jobs || [];
      document.getElementById('history-count-label').textContent = historyJobs.length ? `(${historyJobs.length} total)` : '';
      if (!historyJobs.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">No sends yet.</div><div class="empty-sub">Your bulk send history will appear here.</div></div>';
        return;
      }
      historyPage = 1;
      renderHistoryPage();
    } catch (e) {
      el.innerHTML = `<div class="empty-state"><div class="empty-text">Error: ${e.message}</div></div>`;
    }
  }

  function renderHistoryPage() {
    const totalPages = Math.max(1, Math.ceil(historyJobs.length / HISTORY_PAGE_SIZE));
    historyPage = Math.min(Math.max(1, historyPage), totalPages);
    const start = (historyPage - 1) * HISTORY_PAGE_SIZE;
    const pageJobs = historyJobs.slice(start, start + HISTORY_PAGE_SIZE);

    document.getElementById('history-list').innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>File</th><th>Template</th><th>Sent</th><th>Failed</th><th>Total</th><th>Status</th><th>Date</th><th>Actions</th></tr></thead>
      <tbody>${pageJobs.map((j, localI) => {
        const i = start + localI; // index into the full historyJobs array, not this page's slice
        return `
          <tr>
            <td>${esc(j.source_file || '—')}</td>
            <td>${esc(j.template_name || '—')}</td>
            <td>${j.sent}</td>
            <td>${j.failed}</td>
            <td>${j.total}</td>
            <td><span class="badge ${statusBadgeClass(j.status)}">${esc(j.status)}</span></td>
            <td>${j.created_at ? new Date(j.created_at).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : ''}</td>
            <td>
              <div class="history-actions">
                <button class="btn btn-outline btn-sm" type="button" onclick="showJobAnalytics(${i})">📊 Analytics</button>
                <button class="btn btn-danger btn-sm" type="button" onclick="deleteHistoryJob('${j.id}')" ${['done', 'cancelled'].includes(j.status) ? '' : 'disabled'}>🗑 Delete</button>
              </div>
            </td>
          </tr>`;
      }).join('')}
      </tbody>
    </table></div>`;

    const pag = document.getElementById('history-pagination');
    if (historyJobs.length <= HISTORY_PAGE_SIZE) {
      pag.style.display = 'none';
      pag.innerHTML = '';
      return;
    }
    pag.style.display = 'flex';
    pag.innerHTML = `
      <button class="btn btn-outline btn-sm" onclick="changeHistoryPage(-1)" ${historyPage === 1 ? 'disabled' : ''}>‹ Prev</button>
      <span style="font-size:12.5px;color:var(--text-2)">Page ${historyPage} of ${totalPages}</span>
      <button class="btn btn-outline btn-sm" onclick="changeHistoryPage(1)" ${historyPage === totalPages ? 'disabled' : ''}>Next ›</button>
    `;
  }

  function changeHistoryPage(delta) {
    historyPage += delta;
    renderHistoryPage();
    document.getElementById('history-list').scrollIntoView({ block: 'nearest' });
  }

  async function deleteHistoryJob(jobId) {
    if (!confirm('Delete this send history entry and its delivery logs? This cannot be undone.')) return;
    try {
      const res = await fetch(`${API}/history/${encodeURIComponent(jobId)}`, { method: 'DELETE' });
      const data = await res.json();
      if (!data.success) return alert(data.error || 'Could not delete this history entry');
      historyJobs = historyJobs.filter(job => job.id !== jobId);
      document.getElementById('history-count-label').textContent = historyJobs.length ? `(${historyJobs.length} total)` : '';
      if (!historyJobs.length) {
        document.getElementById('history-list').innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">No sends yet.</div><div class="empty-sub">Your bulk send history will appear here.</div></div>';
        document.getElementById('history-pagination').style.display = 'none';
        return;
      }
      renderHistoryPage();
    } catch (e) {
      alert('Could not delete this history entry: ' + e.message);
    }
  }

  let activeAnalyticsJobId = null;
  let recipientsVisible = false;

  async function toggleRecipients() {
    const panel = document.getElementById('an-recipients');
    const button = document.getElementById('an-recipients-toggle');
    recipientsVisible = !recipientsVisible;
    panel.style.display = recipientsVisible ? 'block' : 'none';
    button.textContent = `${recipientsVisible ? 'Hide' : 'Phone No\'s'} (${button.dataset.count || 0})`;
    if (!recipientsVisible) return;

    panel.innerHTML = '<div class="empty-sub">Loading delivery statuses...</div>';
    try {
      const res = await fetch(`${API}/history/${encodeURIComponent(activeAnalyticsJobId)}/recipients`);
      const data = await res.json();
      if (!data.success) throw new Error(data.error || 'Could not load delivery statuses');
      if (!data.recipients.length) {
        panel.innerHTML = '<div class="empty-sub">No sent phone numbers for this run.</div>';
        return;
      }
      panel.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Phone No</th><th>Name</th><th>Delivery status</th></tr></thead><tbody>${data.recipients.map(r => `
        <tr><td>${esc(r.phone)}</td><td>${esc(r.name || '—')}</td><td>${esc(r.delivery_status)}</td></tr>`).join('')}</tbody></table></div>`;
    } catch (e) {
      panel.innerHTML = `<div class="empty-sub">${esc(e.message)}</div>`;
    }
  }

  function showJobAnalytics(index) {
    const j = historyJobs[index];
    if (!j) return;
    activeAnalyticsJobId = j.id;
    recipientsVisible = false;
    const recipientButton = document.getElementById('an-recipients-toggle');
    recipientButton.dataset.count = j.sent || 0;
    recipientButton.textContent = `Phone No's (${(j.sent || 0).toLocaleString()})`;
    document.getElementById('an-recipients').style.display = 'none';
    document.getElementById('an-recipients').innerHTML = '';

    const pct = j.total ? Math.round((j.sent / j.total) * 100) : 0;
    const started  = j.created_at ? new Date(j.created_at) : null;
    const finished = j.updated_at ? new Date(j.updated_at) : null;
    const durationMs = (started && finished) ? (finished - started) : null;
    const durationStr = durationMs != null
      ? (durationMs < 60000 ? `${Math.round(durationMs / 1000)}s` : `${Math.round(durationMs / 60000)}m`)
      : '—';

    document.getElementById('an-file').textContent     = j.source_file || '—';
    document.getElementById('an-template').textContent = j.template_name || '—';
    document.getElementById('an-status').innerHTML     = `<span class="badge ${statusBadgeClass(j.status)}">${esc(j.status)}</span>`;
    document.getElementById('an-total').textContent    = j.total;
    document.getElementById('an-sent').textContent     = j.sent;
    document.getElementById('an-failed').textContent   = j.failed;
    document.getElementById('an-rate').textContent      = `${pct}%`;
    document.getElementById('an-rate-bar').style.width  = `${pct}%`;
    document.getElementById('an-delay').textContent    = j.delay != null ? `${j.delay}s` : '—';
    document.getElementById('an-duration').textContent = durationStr;
    document.getElementById('an-started').textContent  = started ? started.toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—';

    const errEl = document.getElementById('an-errors');
    if (j.errors && j.errors.length) {
      errEl.innerHTML = `<strong>Errors (up to 10 shown):</strong>` + j.errors.map(e => `<p>${esc(e)}</p>`).join('');
      errEl.style.display = 'block';
    } else {
      errEl.style.display = 'none';
    }

    document.getElementById('analytics-modal').classList.add('open');
  }

  function closeAnalytics() { document.getElementById('analytics-modal').classList.remove('open'); }
  function closeAnalyticsOnBg(e) { if (e.target === document.getElementById('analytics-modal')) closeAnalytics(); }

  loadSidebarStatus();
  loadHistory();

  async function loadSidebarUser() {
    try {
      const res  = await fetch('/api/auth/me', { credentials: 'same-origin' });
      const data = await res.json();
      if (data.logged_in) {
        const displayName = data.name || data.email;
        document.getElementById('sidebar-email').textContent = displayName;
        document.getElementById('sidebar-user').style.display = 'block';
        document.getElementById('hdr-email').textContent = displayName;
        document.getElementById('hdr-avatar').textContent = displayName.charAt(0).toUpperCase();
      }
    } catch (e) {}
  }
  async function doLogout() {
    try { await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }); } catch (e) {}
    try { localStorage.clear(); } catch (e) {}
    try { sessionStorage.clear(); } catch (e) {}
    try {
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys.map((k) => caches.delete(k)));
      }
    } catch (e) {}
    // Best-effort: the session cookie itself is HttpOnly and already cleared
    // by the backend logout call above — this just sweeps any other cookies.
    try {
      document.cookie.split(';').forEach((c) => {
        const name = c.split('=')[0].trim();
        if (name) document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/`;
      });
    } catch (e) {}
    window.location.href = '/login';
  }
  loadSidebarUser();
</script>
</body>
</html>
